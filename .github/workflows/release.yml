# Builds a release zip with the BigWigs packager whenever a version tag (e.g. v1.0.0) is pushed.
# Without extra secrets it only creates a GitHub release. To also upload to CurseForge / Wago,
# add CF_API_KEY / WAGO_API_TOKEN repository secrets and the matching
# "## X-Curse-Project-ID" / "## X-Wago-ID" lines to VenStore.toc.
name: Package and release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
